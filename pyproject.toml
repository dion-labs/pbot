[project]
name = "pocket-bot"
version = "0.1.4"
description = "Experimental local Android automation workbench with durable progress and guarded, owned-only actions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11,<13",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/dion-labs/pbot"
Repository = "https://github.com/dion-labs/pbot.git"
Issues = "https://github.com/dion-labs/pbot/issues"
Changelog = "https://github.com/dion-labs/pbot/blob/main/CHANGELOG.md"

[project.scripts]
pbot = "pbot.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbot"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"
