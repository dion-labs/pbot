[project]
name = "pocket-bot"
version = "0.1.0"
description = "Local, recoverable automation harness for Pokemon TCG Pocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11,<13",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
pbot = "pbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbot"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"
